<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCode Grind — 14 Day Plan</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>LeetCode Grind</h1>
    <p class="subtitle">14 days · 5 problems/day · Anthropic SDE prep</p>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text">0 / 70</span>
    </div>
    <div class="stats">
      <span id="stat-days">0 days complete</span>
      <span id="stat-diff">0 E · 0 M · 0 H</span>
      <button id="reset-btn" title="Clear all progress">Reset</button>
    </div>
  </header>

  <main id="plan"></main>

  <footer>
    <p>Problem links open LeetCode. ✎ creates a dated note in your Obsidian vault (<code>LeetCode/</code>).
    Progress is saved in your browser (localStorage).</p>
  </footer>

  <script src="plan.js"></script>
  <script src="app.js"></script>
</body>
</html>
