<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCode Grind — Adaptive Plan</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>LeetCode Grind</h1>
    <p class="subtitle">Adaptive schedule · Anthropic SDE prep · unfinished work rolls forward</p>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text">0 / 0</span>
    </div>
    <div class="stats">
      <span id="stat-streak"></span>
      <span id="stat-diff"></span>
      <span id="stat-eta"></span>
      <span class="pace-wrap">
        pace
        <button class="pace-btn" data-pace="5">5</button>
        <button class="pace-btn" data-pace="6">6</button>
        <button class="pace-btn" data-pace="7">7</button>/day
      </span>
      <button id="reset-btn" title="Clear all progress">Reset</button>
    </div>
  </header>

  <main id="plan"></main>

  <footer>
    <p>Problem links open LeetCode. ✎ note creates/opens a note in your Obsidian vault.
    Progress is saved in your browser — miss a day and the schedule just re-chunks.</p>
  </footer>

  <script src="plan.js"></script>
  <script src="app.js"></script>
</body>
</html>
